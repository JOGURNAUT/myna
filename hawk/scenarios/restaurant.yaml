# Second vertical: restaurant reservations (Spice Route Kitchen, clinics/spice-route.yaml).
# Clock: Monday 12 Oct 2026, 11:00 IST. Open daily 12-15 and 19-23. Tables: 1-2 seat two,
# 3-4 seat two or four, 5 seats four or six. Verification is name + phone, never a date of birth.
# All guests are synthetic.

- id: rest-book-for-four
  title: New guest books a table for four tomorrow at 8 pm (number from caller ID)
  flow: booking
  vertical: restaurant
  business: spice-route
  type: book_new
  callerPhone: '9822200301'
  caller: { name: Kabir Anand, nameHi: कबीर आनंद, phone: '9822200301' }
  goal: { intent: book, service: table-4, partySize: 4, when: { day: tomorrow, time: '20:00' } }
  expect:
    appointments:
      - { patient: Kabir Anand, service: table-4, start: 2026-10-13T20:00 }
    neverSay: [birth, जन्मतिथि]

