name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tests and the Hawk gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A real Redis: the shared-state tests and the scaled-out Hawk run use it instead of mocks.
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6 # version from package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - name: Python deps
        working-directory: services/agent
        run: uv sync --frozen

      - name: TypeScript — lint, format, types, tests
        run: |
          pnpm lint
          pnpm format:check
          pnpm typecheck
          pnpm test
          pnpm build   # the web app (Next.js) must compile

      - name: Python — lint, format, tests
        working-directory: services/agent
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
          uv run pytest -q

      # Fails the build if any flow is NOT SAFE. Two agent instances share the real Redis above,
      # and every turn of a call is served by the other one: "works scaled out" is graded.
      - name: Hawk go-live gate (2 instances, shared Redis)
        run: pnpm hawk run --gate --instances 2 --out hawk-reports

      - name: Upload the Hawk report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hawk-report
          path: hawk-reports/
          if-no-files-found: ignore
